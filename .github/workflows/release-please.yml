name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes in its own job so only these steps hold the OIDC publish token,
  # and through the `npm` environment, which only main can deploy to.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    environment: npm
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Everything below runs only when release-please merges its PR and
      # creates a release. The full test suite already ran in CI against
      # the same commit before release-please merged it to main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build:clean

      # Trusted Publisher (OIDC) needs npm CLI >= 11.5.1; Node 22 ships
      # with npm 10.x. Run the modern CLI via `npx` from its separate
      # cache instead of `npm install -g npm@latest`, which races against
      # the running npm mid-install ("Cannot find module 'promise-retry'").
      # npm 11+ also requires an explicit --tag for prereleases.
      #
      # The CLI version is pinned exactly rather than `@latest`: this step
      # runs with the OIDC publish credential live, so whatever the
      # registry serves here executes with publish access. Dependabot does
      # not track this value; bump NPM_CLI_VERSION by hand (keep >= 11.5.1
      # and within the Node range installed by ./.github/actions/setup).
      - name: Publish to npm
        env:
          NPM_CLI_VERSION: 12.0.2
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            tag="${version#*-}"
            tag="${tag%%.*}"
            npx -y "npm@${NPM_CLI_VERSION}" publish --provenance --access public --tag "$tag"
          else
            npx -y "npm@${NPM_CLI_VERSION}" publish --provenance --access public
          fi
